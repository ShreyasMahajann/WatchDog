name: Release APK

# Two ways to publish a release, both create a GitHub Release with the APK:
#   1. Push a version tag:   git tag v0.1.0 && git push origin v0.1.0
#   2. Actions tab -> "Release APK" -> "Run workflow" -> enter a version (e.g. 0.1.0)
# The manual run creates the tag for you at the current commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (a v-prefixed tag is created)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            NAME="${TAG#v}"
          else
            NAME="${{ github.event.inputs.version }}"
            TAG="v${NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Run Android JVM unit tests
        working-directory: android
        run: gradle :core:test :app:testDebugUnitTest

      - name: Run Android lint
        working-directory: android
        run: gradle lintDebug

      - name: Build APK
        working-directory: android
        run: >
          gradle assembleDebug
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ steps.ver.outputs.code }}

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/watchDog-${{ steps.ver.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: watchDog ${{ steps.ver.outputs.tag }}
          files: dist/watchDog-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Desktop apps for Windows and Linux, attached to the same release.
  desktop:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"; TAG="$GITHUB_REF_NAME"
          else
            NAME="${{ github.event.inputs.version }}"; TAG="v${NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # jpackage needs fakeroot/binutils to build a .deb on Linux.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      # jpackage needs the WiX Toolset (v3) to build a Windows installer.
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Build desktop installer
        working-directory: android
        run: gradle :desktop:packageDistributionForCurrentOS -PversionName=${{ steps.ver.outputs.name }}

      - name: Stage installer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp android/desktop/build/compose/binaries/main/deb/*.deb \
            "dist/watchDog-${{ steps.ver.outputs.name }}-linux.deb"

      - name: Stage installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp android/desktop/build/compose/binaries/main/exe/*.exe \
            "dist/watchDog-${{ steps.ver.outputs.name }}-windows.exe"

      # Each runner produces exactly one installer (.deb on Linux, .exe on Windows);
      # the Stage step above fails the job if packaging produced nothing, so a
      # non-matching glob here is expected and must not fail the upload.
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: false
