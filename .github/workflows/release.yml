name: Release APK

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag build produces an APK and attaches it to an auto-created GitHub Release.
# workflow_dispatch runs the same build but only uploads a run artifact (no release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      label:
        description: "Version label for a manual build (no release is published)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ github.event.inputs.label }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: >
          gradle assembleDebug
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ steps.ver.outputs.code }}

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/watchDog-${{ steps.ver.outputs.name }}.apk"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/watchDog-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchDog-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
