name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run JVM unit tests
        working-directory: android
        run: gradle :core:test :app:testDebugUnitTest
      - name: Run Android lint
        working-directory: android
        run: gradle lintDebug
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watchDog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # jpackage needs fakeroot/binutils for a .deb, and the WiX Toolset for a .exe.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Build desktop installer (.deb / .exe)
        working-directory: android
        run: gradle :desktop:packageDistributionForCurrentOS

      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: watchDog-linux-deb
          path: android/desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload Windows .exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: watchDog-windows-exe
          path: android/desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
